services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-star_accounting}
      MYSQL_USER: ${DB_USER:-accounting}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=TCP --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api-runtime:
    image: wotty-staraccounting-api:go
    container_name: wotty-staraccounting-api-1
    build:
      context: .
      dockerfile: Dockerfile.api.go
    restart: unless-stopped
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:mysql://127.0.0.1:${MYSQL_HOST_PORT:-3307}/${MYSQL_DATABASE:-star_accounting}}
      DB_USER: ${DB_USER:-accounting}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      API_HOST: ${API_HOST:-10.126.126.9}
      API_PORT: ${API_PORT:-12367}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      # Deployment must initialise new databases and apply compatible additions.
      DB_AUTO_MIGRATE: "true"
      # 留空时普通登录可用，但忘记密码和注册开关不可用。
      ACCOUNT_ADMIN_KEY: ${ACCOUNT_ADMIN_KEY:-}
      # 两种 Android 安装版分别公布更新信息；KT 混合版地址不能复用 Web 壳 APK。
      APP_VERSION_CODE: ${APP_VERSION_CODE:-107}
      APP_VERSION_NAME: ${APP_VERSION_NAME:-0.0.107}
      APP_APK_URL: ${APP_APK_URL:-}
      APP_CHANGELOG: ${APP_CHANGELOG:-}
      APP_FORCE_UPDATE: ${APP_FORCE_UPDATE:-false}
      APP_KTWEB_VERSION_CODE: ${APP_KTWEB_VERSION_CODE:-}
      APP_KTWEB_VERSION_NAME: ${APP_KTWEB_VERSION_NAME:-}
      APP_KTWEB_APK_URL: ${APP_KTWEB_APK_URL:-}
      APP_KTWEB_CHANGELOG: ${APP_KTWEB_CHANGELOG:-}
      APP_KTWEB_FORCE_UPDATE: ${APP_KTWEB_FORCE_UPDATE:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - \"http://$${API_HOST:-127.0.0.1}:$${API_PORT:-12367}/api/health\" | grep -q '\"db\":true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api-runtime
    ports:
      - "127.0.0.1:12366:80"

volumes:
  mysql-data:
