services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      DB_USER: ${DB_USER:-accounting}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      API_HOST: ${API_HOST:-10.126.126.9}
      API_PORT: ${API_PORT:-12367}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      # 留空时普通登录可用，但忘记密码和注册开关不可用。
      ACCOUNT_ADMIN_KEY: ${ACCOUNT_ADMIN_KEY:-}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:12366:80"
