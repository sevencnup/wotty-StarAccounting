services:
  credential-init:
    image: alpine:3.21
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ACCOUNT_ADMIN_KEY: ${ACCOUNT_ADMIN_KEY:-}
    volumes:
      - mysql-data:/var/lib/mysql:ro
      - mysql-root-secret:/run/secrets/mysql-root
      - db-secret:/run/secrets/db
      - api-secret:/run/secrets/api
      - ./docker/init-credentials.sh:/usr/local/bin/init-credentials.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-credentials.sh"]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      credential-init:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root/password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-star_accounting}
      MYSQL_USER: ${DB_USER:-accounting}
      MYSQL_PASSWORD_FILE: /run/secrets/db/password
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-root-secret:/run/secrets/mysql-root:ro
      - db-secret:/run/secrets/db:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$(cat /run/secrets/mysql-root/password)" mysql --protocol=TCP --host=127.0.0.1 --user=root --silent --skip-column-names --execute='SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api-runtime:
    image: wotty-staraccounting-api:go
    container_name: wotty-staraccounting-api-1
    build:
      context: .
      dockerfile: Dockerfile.api.go
    restart: unless-stopped
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
      credential-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:mysql://127.0.0.1:${MYSQL_HOST_PORT:-3307}/${MYSQL_DATABASE:-star_accounting}}
      DB_USER: ${DB_USER:-accounting}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-12367}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      # Deployment must initialise new databases and apply compatible additions.
      DB_AUTO_MIGRATE: "true"
      # 两种 Android 安装版分别公布更新信息；KT 混合版地址不能复用 Web 壳 APK。
      APP_VERSION_CODE: ${APP_VERSION_CODE:-107}
      APP_VERSION_NAME: ${APP_VERSION_NAME:-0.0.107}
      APP_APK_URL: ${APP_APK_URL:-}
      APP_CHANGELOG: ${APP_CHANGELOG:-}
      APP_FORCE_UPDATE: ${APP_FORCE_UPDATE:-false}
      APP_KTWEB_VERSION_CODE: ${APP_KTWEB_VERSION_CODE:-}
      APP_KTWEB_VERSION_NAME: ${APP_KTWEB_VERSION_NAME:-}
      APP_KTWEB_APK_URL: ${APP_KTWEB_APK_URL:-}
      APP_KTWEB_CHANGELOG: ${APP_KTWEB_CHANGELOG:-}
      APP_KTWEB_FORCE_UPDATE: ${APP_KTWEB_FORCE_UPDATE:-false}
    volumes:
      - db-secret:/run/secrets/db:ro
      - api-secret:/run/secrets/api:ro
    healthcheck:
      test: ["CMD-SHELL", "host=\"$${API_HOST:-127.0.0.1}\"; [ \"$$host\" = 0.0.0.0 ] && host=127.0.0.1; wget -q -O - \"http://$$host:$${API_PORT:-12367}/api/health\" | grep -q '\"db\":true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    image: wotty-staraccounting-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api-runtime:
        condition: service_healthy
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_HOST_PORT:-12366}:80"

volumes:
  mysql-data:
  mysql-root-secret:
  db-secret:
  api-secret:
