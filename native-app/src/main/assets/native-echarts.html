<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body, #chart { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: transparent; }
  </style>
  <script src="echarts.min.js"></script>
</head>
<body>
  <div id="chart"></div>
  <script>
    (() => {
      const root = document.getElementById("chart");
      const chart = echarts.init(root, null, { renderer: "canvas" });
      const money = (value) => Number(value || 0).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      let captureTimer = null;

      const captureNativeChart = () => {
        if (!window.NativeChart) return;
        try {
          window.NativeChart.onRenderImage(chart.getDataURL({ type: "png" }));
        } catch (error) {
          console.error("native chart image export failed", error);
        }
      };

      const scheduleNativeChartCapture = (delay = 1200) => {
        clearTimeout(captureTimer);
        captureTimer = setTimeout(() => requestAnimationFrame(captureNativeChart), delay);
      };

      window.setNativeChartSize = (width, height) => {
        const nextWidth = Math.max(1, Number(width) || 1);
        const nextHeight = Math.max(1, Number(height) || 1);
        root.style.width = `${nextWidth}px`;
        root.style.height = `${nextHeight}px`;
        chart.resize({ width: nextWidth, height: nextHeight, silent: true });
        scheduleNativeChartCapture(1200);
      };

      window.dispatchNativeChartTap = (x, y) => {
        const pointX = Number(x || 0);
        const pointY = Number(y || 0);
        const option = chart.getOption();
        const emit = ({ componentType = "series", name = "", seriesName = "", dataIndex = -1, dataType = "" }) => {
          if (!window.NativeChart) return null;
          window.NativeChart.onDataClick(JSON.stringify({ componentType, dataType, name, seriesName, dataIndex, tapX: pointX, tapY: pointY }));
          return { componentType, name, seriesName, dataIndex, dataType };
        };
        const inside = (layout) => layout && pointX >= layout.x && pointX <= layout.x + (layout.width ?? layout.dx ?? 0)
          && pointY >= layout.y && pointY <= layout.y + (layout.height ?? layout.dy ?? 0);

        for (let seriesIndex = 0; seriesIndex < (option.series || []).length; seriesIndex++) {
          const series = option.series[seriesIndex];
          if (series.type === "pie") {
            const seriesModel = chart.getModel().getSeriesByIndex(seriesIndex);
            const data = seriesModel?.getData();
            if (!data?.getItemLayout) continue;
            let nearestSlice = null;
            for (let dataIndex = 0; dataIndex < data.count(); dataIndex++) {
              const layout = data.getItemLayout(dataIndex);
              if (!layout || !Number.isFinite(layout.cx) || !Number.isFinite(layout.cy)
                || !Number.isFinite(layout.r0) || !Number.isFinite(layout.r)
                || !Number.isFinite(layout.startAngle) || !Number.isFinite(layout.endAngle)) continue;

              const deltaX = pointX - layout.cx;
              const deltaY = pointY - layout.cy;
              const distance = Math.hypot(deltaX, deltaY);
              const radialGap = distance < layout.r0 ? layout.r0 - distance : distance > layout.r ? distance - layout.r : 0;

              const fullTurn = Math.PI * 2;
              let pointAngle = Math.atan2(deltaY, deltaX);
              let insideAngle;
              if (layout.clockwise !== false) {
                if (pointAngle < layout.startAngle) {
                  pointAngle += Math.ceil((layout.startAngle - pointAngle) / fullTurn) * fullTurn;
                }
                insideAngle = pointAngle <= layout.endAngle + 0.001;
              } else {
                if (pointAngle > layout.startAngle) {
                  pointAngle -= Math.ceil((pointAngle - layout.startAngle) / fullTurn) * fullTurn;
                }
                insideAngle = pointAngle >= layout.endAngle - 0.001;
              }
              if (insideAngle) {
                if (radialGap <= 0.001) {
                  chart.dispatchAction({ type: "showTip", seriesIndex, dataIndex });
                  return emit({ name: data.getName(dataIndex) || "", seriesName: series.name || "", dataIndex });
                }
              }

              let angularGap = 0;
              if (!insideAngle) {
                const distanceToAngle = (left, right) => {
                  const difference = Math.abs(left - right) % fullTurn;
                  return Math.min(difference, fullTurn - difference);
                };
                angularGap = Math.min(
                  distanceToAngle(pointAngle, layout.startAngle),
                  distanceToAngle(pointAngle, layout.endAngle),
                );
              }
              const maxTapAngleGap = 8 * Math.PI / 180;
              const maxTapRadiusGap = 12;
              if (angularGap <= maxTapAngleGap && radialGap <= maxTapRadiusGap) {
                const candidate = { dataIndex, insideAngle, radialGap, angularGap };
                const isBetter = !nearestSlice
                  || (candidate.insideAngle && !nearestSlice.insideAngle)
                  || (candidate.insideAngle === nearestSlice.insideAngle && candidate.radialGap < nearestSlice.radialGap)
                  || (candidate.insideAngle === nearestSlice.insideAngle && candidate.radialGap === nearestSlice.radialGap && candidate.angularGap < nearestSlice.angularGap);
                if (isBetter) nearestSlice = candidate;
              }
            }
            if (nearestSlice) {
              const dataIndex = nearestSlice.dataIndex;
              chart.dispatchAction({ type: "showTip", seriesIndex, dataIndex });
              return emit({ name: data.getName(dataIndex) || "", seriesName: series.name || "", dataIndex });
            }
            continue;
          }

          const seriesModel = chart.getModel().getSeriesByIndex(seriesIndex);
          const data = seriesModel?.getData();
          if (!data?.getItemLayout) continue;
          const sankeyOffset = series.type === "sankey"
            ? { x: Number(series.left) || 0, y: Number(series.top) || 0 }
            : { x: 0, y: 0 };
          for (let dataIndex = 0; dataIndex < data.count(); dataIndex++) {
            const layout = data.getItemLayout(dataIndex);
            if (!inside({
              ...layout,
              x: Number(layout?.x || 0) + sankeyOffset.x,
              y: Number(layout?.y || 0) + sankeyOffset.y,
            })) continue;
            const name = series.name === "商家消费"
              ? (option.yAxis?.[0]?.data?.[dataIndex] || "")
              : (series.type === "sankey" ? (series.data?.[dataIndex]?.name || "") : "");
            const dataType = series.type === "sankey" ? "node" : "";
            return emit({ name, seriesName: series.name || "", dataIndex, dataType });
          }
        }
        if ((option.series || []).some((series) => series.type === "pie")) {
          chart.dispatchAction({ type: "hideTip" });
          return emit({ componentType: "background" });
        }
        return null;
      };

      window.renderNativeChart = (serializedOption) => {
        const option = JSON.parse(serializedOption);
        const compactAxis = option.__nativeCompactAxis;
        const pieTooltip = option.__nativePieTooltip === true;
        const sankeyTooltip = option.__nativeSankeyTooltip === true;
        delete option.__nativeCompactAxis;
        delete option.__nativePieTooltip;
        delete option.__nativeSankeyTooltip;

        if (compactAxis && option[compactAxis === "x" || compactAxis === "loan-y" ? "xAxis" : "yAxis"]?.axisLabel) {
          const axis = compactAxis === "x" || compactAxis === "loan-y" ? "xAxis" : "yAxis";
          if (compactAxis === "loan-y") {
            option[axis].axisLabel.formatter = (value) => Number(value) >= 1000 ? `${(Number(value) / 1000).toFixed(0)}k` : `${value}`;
          } else {
            option[axis].axisLabel.formatter = (value) => {
              const amount = Number(value);
              if (amount === 0) return "0";
              return Math.abs(amount) >= 1000 ? `${Math.round(amount / 1000)}K` : `${Math.round(amount)}`;
            };
          }
        }
        if (option.tooltip && option.tooltip.valueFormatter === "¥ {value}") {
          option.tooltip.valueFormatter = (value) => `¥ ${money(value)}`;
        }
        if (option.tooltip && pieTooltip) {
          option.tooltip.formatter = (event) => `${event.name || ""}<br/>¥ ${money(event.value)} (${Number(event.percent || 0).toFixed(1)}%)`;
        }
        if (option.tooltip && sankeyTooltip) {
          option.tooltip.formatter = (event) => {
            const displayName = (event.name || "").replace(/^(account|category)::/, "");
            if (event.dataType === "edge" && event.data) {
              const source = String(event.data.source || "").replace(/^account::/, "");
              const target = String(event.data.target || "").replace(/^category::/, "");
              return `${source} → ${target}<br/>¥ ${money(event.value)}`;
            }
            return displayName;
          };
        }
        if (option.tooltip && option.tooltip.trigger === "axis" && option.tooltip.formatter === "{b}<br/>¥ {c}") {
          option.tooltip.formatter = (items) => {
            const rows = Array.isArray(items) ? items : [items];
            const title = rows[0]?.axisValueLabel || rows[0]?.name || "";
            return `${title}<br/>${rows.map((item) => `${item.marker || ""}${item.seriesName || ""} ¥ ${money(item.value)}`).join("<br/>")}`;
          };
        }
        chart.setOption(option, true);
        chart.resize();
        scheduleNativeChartCapture(1200);
        return {
          version: echarts.version,
          root: [root.clientWidth, root.clientHeight],
          chart: [chart.getWidth(), chart.getHeight()],
          canvases: root.querySelectorAll("canvas").length,
          series: (chart.getOption().series || []).map((item) => ({ type: item.type, points: (item.data || []).length }))
        };
      };

      chart.on("click", (event) => {
        if (!window.NativeChart) return;
        window.NativeChart.onDataClick(JSON.stringify({
          componentType: event.componentType || "",
          dataType: event.dataType || "",
          name: event.name || "",
          seriesName: event.seriesName || "",
          dataIndex: Number.isInteger(event.dataIndex) ? event.dataIndex : -1
        }));
      });

      chart.on("finished", () => scheduleNativeChartCapture(100));

      if (window.ResizeObserver) {
        new ResizeObserver(() => {
          chart.resize();
          scheduleNativeChartCapture(1200);
        }).observe(root);
      } else {
        window.addEventListener("resize", () => chart.resize());
      }
    })();
  </script>
</body>
</html>
