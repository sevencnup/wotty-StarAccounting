<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}#chart{width:100%;height:100%}</style>
<script src="echarts.min.js"></script>
</head>
<body>
<div id="chart"></div>
<script>
(function () {
  var chart = null;
  var pending = null;
  function money(v) {
    return '¥ ' + Number(v || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function applyFormatters(opt) {
    if (opt && opt.tooltip) {
      if (opt.tooltip._fmt === 'money') {
        opt.tooltip.valueFormatter = function (v) { return money(v); };
        delete opt.tooltip._fmt;
      } else if (opt.tooltip._fmt === 'ratio') {
        opt.tooltip.formatter = function (p) {
          return (p.name || '') + '<br/>' + money(p.value) + ' (' + (p.percent || 0) + '%)';
        };
        delete opt.tooltip._fmt;
      }
    }
    ['xAxis', 'yAxis'].forEach(function (key) {
      var a = opt && opt[key];
      if (!a) return;
      (Array.isArray(a) ? a : [a]).forEach(function (item) {
        if (item && item.axisLabel && item.axisLabel._fmt === 'k') {
          item.axisLabel.formatter = function (v) { return v === 0 ? '0' : Math.round(v / 1000) + 'K'; };
          delete item.axisLabel._fmt;
        }
      });
    });
  }
  function init() {
    var el = document.getElementById('chart');
    var w = window.innerWidth;
    var h = window.innerHeight;
    if (!el || w === 0 || h === 0) {
      setTimeout(init, 50);
      return;
    }
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    chart = echarts.init(el);
    if (pending) { chart.setOption(pending, true); pending = null; }
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(init, 0);
  } else {
    window.addEventListener('DOMContentLoaded', function () { setTimeout(init, 0); });
  }
  window.setOptionB64 = function (b64) {
    try {
      var opt = JSON.parse(atob(b64));
      applyFormatters(opt);
      if (chart) { chart.setOption(opt, true); chart.resize(); }
      else { pending = opt; }
    } catch (e) {}
  };
  window.addEventListener('resize', function () { if (chart) chart.resize(); });
})();
</script>
</body>
</html>
