<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}#chart{width:100%;height:100%}</style>
<script src="echarts.min.js"></script>
</head>
<body>
<div id="chart"></div>
<script>
(function () {
  var chart = null;
  var pending = null;
  function init() {
    var el = document.getElementById('chart');
    if (!el || el.offsetWidth === 0 || el.offsetHeight === 0) {
      setTimeout(init, 50);
      return;
    }
    chart = echarts.init(el);
    window.__chart = chart;
    if (pending) { chart.setOption(pending, true); pending = null; }
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(init, 0);
  } else {
    window.addEventListener('DOMContentLoaded', function () { setTimeout(init, 0); });
  }
  window.setOptionB64 = function (b64) {
    try {
      var opt = JSON.parse(atob(b64));
      if (chart) { chart.setOption(opt, true); chart.resize(); }
      else { pending = opt; }
    } catch (e) {}
  };
  window.addEventListener('resize', function () { if (chart) chart.resize(); });
})();
</script>
</body>
</html>
