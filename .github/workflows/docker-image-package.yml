name: Docker Image Package

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Docker image archive
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build application images
        run: docker compose -p wotty-staraccounting build

      - name: Export image archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" == v*-beta.* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p 'require("./package.json").version')"
          fi
          short_sha="${GITHUB_SHA:0:7}"
          image_tag="${version}-g${short_sha}"
          archive_name="star-accounting-docker-online-${image_tag}-linux-amd64-run${GITHUB_RUN_NUMBER}.tar.gz"
          output_dir="$RUNNER_TEMP/star-accounting-docker"
          mkdir -p "$output_dir"

          docker tag wotty-staraccounting-api:go "wotty-staraccounting-api:$image_tag"
          docker tag wotty-staraccounting-web:latest "wotty-staraccounting-web:$image_tag"
          docker save \
            wotty-staraccounting-api:go \
            "wotty-staraccounting-api:$image_tag" \
            wotty-staraccounting-web:latest \
            "wotty-staraccounting-web:$image_tag" | gzip -6 > "$output_dir/$archive_name"

          (cd "$output_dir" && sha256sum "$archive_name" > "$archive_name.sha256")
          printf 'artifact_name=%s\n' "${archive_name%.tar.gz}" >> "$GITHUB_OUTPUT"
          printf 'output_dir=%s\n' "$output_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Docker image package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ steps.archive.outputs.output_dir }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
